<div class="carousel-container">
  <button class="carousel-control prev" (click)="prevSlide()" aria-label="Plan anterior">&#9664;</button>

  <div class="carousel">
    <div *ngFor="let plan of plans; let i = index" class="plan-card" [ngClass]="getClass(i)">
      <div class="card-header">
        <span class="plan-badge">Mejor opción</span>
        <h3>{{ plan.name }}</h3>
        <span class="vigencia">Vigencia: {{ plan.duration }}</span>
      </div>

      <div class="card-body">
        <div class="valor">
          <span class="price-label">Desde</span>
          <h4>{{ plan.price }}</h4>
        </div>

        <ul class="features-list">
          <li *ngFor="let feature of plan.features" class="feature-item">
            <img [src]="'assets/icons/' + feature.icon" [alt]="feature.label" class="feature-icon">
            <span class="feature-text"><strong>{{ feature.label }}:</strong> {{ feature.value }}</span>
          </li>

          <li class="feature-item terms-item">
            <img src="assets/icons/info.png" alt="TyC" class="feature-icon">
            <span class="feature-text">
              <strong>Términos y condiciones:</strong>
              <a href="https://lov.com.co/directv/documents/terminos_y_condiciones_de_la_oferta_comercial.pdf"
                target="_blank">TyC</a>
            </span>
          </li>

          <li class="feature-item apps-item">
            <div class="app-label">
              <p>Este plan incluye</p>
            </div>
            <div class="app-icons">
              <img *ngFor="let app of plan.apps" [src]="'assets/icons/' + app" [alt]="app.split('.')[0]"
                class="feature-icon">
            </div>
          </li>
        </ul>

        <a href="https://recaudo.similtech.co/Directv/Front/" target="_blank" class="submit-button">
          Lo quiero
        </a>
      </div>
    </div>
  </div>

  <button class="carousel-control next" (click)="nextSlide()" aria-label="Siguiente plan">&#9654;</button>
</div>
